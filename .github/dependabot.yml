version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL rejects workflows whose init and analyze steps differ in version.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The Go toolchain pin changes across every build file together; see docs/go-toolchain.md.
      - dependency-name: golang
